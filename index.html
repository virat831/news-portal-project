<!DOCTYPE html>
<html>
<head>
<title>Daily News Portal</title>

<style>
body{
  font-family: Arial;
  margin:0;
  background:#f5f5f5;
}

/* NAVBAR */
nav{
  background:#112227;
  padding:15px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  flex-wrap:wrap;
}

nav h2{color:white;margin:0;}

.search-box{
  padding:8px;
  border-radius:5px;
  border:none;
  width:200px;
}

.menu{
  width:100%;
  text-align:center;
  margin-top:10px;
}

.menu a{
  color:white;
  margin:10px;
  cursor:pointer;
  font-weight:bold;
}

.menu a:hover{color:#3b82f6;}

.hero{
  height:300px;
  background:url('https://images.unsplash.com/photo-1504711434969-e33886168f5c');
  background-size:cover;
  background-position:center;
  display:flex;
  justify-content:center;
  align-items:center;
  color:white;
}

.hero h1{
  background:rgba(0,0,0,0.6);
  padding:15px 25px;
  border-radius:10px;
}

/* ADMIN FORM */
.form-box{
  display:none;
  text-align:center;
  padding:20px;
}

.form-box input{
  padding:8px;
  margin:5px;
  width:220px;
}

.form-box button{
  padding:10px;
  background:green;
  color:white;
  border:none;
  cursor:pointer;
}

/* NEWS */
.container{
  display:flex;
  flex-wrap:wrap;
  gap:20px;
  padding:30px;
  justify-content:center;
}

.card{
  background:white;
  width:260px;
  border-radius:10px;
  box-shadow:0 4px 10px rgba(0,0,0,0.2);
  overflow:hidden;
}

.card img{
  width:100%;
  height:160px;
  object-fit:cover;
}

.card-content{padding:15px;}

.delete-btn{
  background:red;
  color:white;
  border:none;
  padding:5px;
  cursor:pointer;
  margin-top:5px;
}

footer{
  background:#111827;
  color:white;
  text-align:center;
  padding:10px;
}
</style>
</head>

<body>

<!-- NAVBAR -->
<nav>
  <h2>📰 DailyNews</h2>

  <input class="search-box" type="text" placeholder="Search..." onkeyup="searchNews(this.value)">

  <button onclick="login()">Admin</button>

  <div class="menu">
    <a onclick="filterNews('all')">Home</a>
    <a onclick="filterNews('Technology')">Technology</a>
    <a onclick="filterNews('Politics')">Politics</a>
    <a onclick="filterNews('Sports')">Sports</a>
    <a onclick="filterNews('Business')">Business</a>
    <a onclick="filterNews('Entertainment')">Entertainment</a>
  </div>
</nav>

<!-- HERO -->
<div class="hero">
  <h1>Stay Updated with Latest News</h1>
</div>

<!-- ADMIN FORM -->
<div class="form-box" id="adminForm">
  <h2>Add News</h2>
  <input id="title" placeholder="Title"><br>
  <input id="desc" placeholder="Description"><br>
  <input id="img" placeholder="Image URL"><br>
  <input id="cat" placeholder="Category"><br>
  <button onclick="addNews()">Add News</button>
</div>

<!-- NEWS -->
<div class="container" id="news-container"></div>

<footer>
DailyNews © 2026
</footer>

<!-- SUPABASE -->
<script src="https://unpkg.com/@supabase/supabase-js@1"></script>

<script>
const supabaseClient = supabase.createClient(
  "https://ufyjbyhjulxarfnvwuvb.supabase.co",
  "sb_publishable_73mw2OvGn_DUxTeL4uE4Tw_HNVZwOTf"
);

let allNews = [];
let currentCategory = "all";
let isAdmin = false;

// LOAD NEWS
async function loadNews(){
  const { data } = await supabaseClient.from("news1").select("*");
  allNews = data;
  displayNews(data);
}

// DISPLAY NEWS
function displayNews(data){
  let container = document.getElementById("news-container");
  container.innerHTML = "";

  data.forEach(n => {

    let deleteBtn = "";

    if(isAdmin){
      deleteBtn = `<button class="delete-btn" onclick="deleteNews(${n.id})">Delete</button>`;
    }

    let img = n.image && n.image.startsWith("http")
      ? n.image
      : "https://via.placeholder.com/300";

    container.innerHTML += `
    <div class="card">
      <img src="${img}">
      <div class="card-content">
        <h3>${n.title}</h3>
        <p>${n.description}</p>
        <p><b>${n.category}</b></p>
        ${deleteBtn}
      </div>
    </div>`;
  });
}

// FILTER
function filterNews(cat){
  currentCategory = cat;

  if(cat === "all"){
    displayNews(allNews);
  } else {
    displayNews(allNews.filter(n => n.category === cat));
  }
}

// SEARCH
function searchNews(text){
  let filtered = allNews;

  if(currentCategory !== "all"){
    filtered = filtered.filter(n => n.category === currentCategory);
  }

  filtered = filtered.filter(n =>
    (n.title || "").toLowerCase().includes(text.toLowerCase()) ||
    (n.description || "").toLowerCase().includes(text.toLowerCase())
  );

  displayNews(filtered);
}

// ADD NEWS
async function addNews(){
  if(!isAdmin){
    alert("Only admin can add news ❌");
    return;
  }

  await supabaseClient.from("news1").insert([{
    title: document.getElementById("title").value,
    description: document.getElementById("desc").value,
    image: document.getElementById("img").value,
    category: document.getElementById("cat").value
  }]);

  loadNews();
}

// DELETE NEWS
async function deleteNews(id){
  if(!isAdmin){
    alert("Only admin can delete ❌");
    return;
  }

  await supabaseClient.from("news1").delete().eq("id", id);
  loadNews();
}

// ADMIN LOGIN
function login(){
  let pass = prompt("Enter Admin Password:");

  if(pass === "1234"){
    isAdmin = true;
    document.getElementById("adminForm").style.display = "block";
    alert("Admin Mode Enabled ✅");
    loadNews();
  } else {
    alert("Wrong password ❌");
  }
}

// START
loadNews();
</script>

</body>
</html>
