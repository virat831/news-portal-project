<!DOCTYPE html>
<html>
<head>
<title>Daily News Portal</title>

<style>
body{
font-family: Arial;
background:#f5f7fa;
margin:0;
}

nav{
background:#112227;
padding:15px;
display:flex;
justify-content:space-between;
align-items:center;
}

nav h2{
color:white;
margin-left:20px;
}

nav div a{
color:white;
margin:15px;
text-decoration:none;
font-weight:bold;
}

nav div a:hover{
color:#3b82f6;
}

.hero{
height:350px;
background:url('https://images.unsplash.com/photo-1504711434969-e33886168f5c');
background-size:cover;
background-position:center;
display:flex;
justify-content:center;
align-items:center;
color:white;
text-align:center;
}

.hero h1{
font-size:42px;
background:rgba(0,0,0,0.6);
padding:15px 30px;
border-radius:10px;
}

.container{
padding:40px;
display:flex;
gap:25px;
flex-wrap:wrap;
justify-content:center;
}

.card{
background:white;
width:280px;
border-radius:12px;
box-shadow:0 5px 15px rgba(0,0,0,0.2);
overflow:hidden;
transition:0.3s;
}

.card:hover{
transform:scale(1.05);
}

.card img{
width:100%;
height:180px;
object-fit:cover;
}

.card-content{
padding:15px;
}

footer{
background:#111827;
color:white;
padding:15px;
text-align:center;
margin-top:40px;
}
</style>
</head>

<body>

<nav>
<h2>📰 DailyNews</h2>
<div>
<a href="./index.html">Home</a>
</div>
</nav>

<div class="hero">
<h1>Live News from Supabase</h1>
</div>

<div class="container" id="news-container">
<h2>Loading...</h2>
</div>

<footer>
DailyNews © 2026
</footer>

<!-- ✅ CORRECT CDN -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const supabase = window.supabase.createClient(
  "https://ufyjbyhjulxarfnvwuvb.supabase.co",
  "sb_publishable_73mw2OvGn_DUxTeL4uE4Tw_HNVZwOTf"
);

async function loadNews() {
  const container = document.getElementById("news-container");

  const { data, error } = await supabase
    .from("news1")
    .select("*");

  console.log("DATA:", data);
  console.log("ERROR:", error);

  if (error) {
    container.innerHTML = "<h2>❌ Error loading data</h2>";
    return;
  }

  if (!data || data.length === 0) {
    container.innerHTML = "<h2>⚠️ No data found</h2>";
    return;
  }

  container.innerHTML = "";

  data.forEach(news => {

    let img = "https://via.placeholder.com/300";

    if (news.image && news.image.startsWith("http")) {
      img = news.image;
    }

    container.innerHTML += `
      <div class="card">
        <img src="${img}">
        <div class="card-content">
          <h3>${news.title || "No Title"}</h3>
          <p>${news.description || "No Description"}</p>
          <p><b>${news.category || "General"}</b></p>
        </div>
      </div>
    `;
  });
}

loadNews();
</script>

</body>
</html>
