<!DOCTYPE html>
<html>
<head>
<title>Daily News Portal</title>

<style>

body{
font-family: Arial;
background:#f5f7fa;
margin:0;
}

/* NAVBAR */
nav{
background:#112227;
padding:15px;
display:flex;
justify-content:space-between;
align-items:center;
}

nav h2{
color:white;
margin-left:20px;
}

nav div a{
color:white;
margin:15px;
text-decoration:none;
font-weight:bold;
}

nav div a:hover{
color:#3b82f6;
}

/* HERO IMAGE */
.hero{
height:350px;
background:url('https://images.unsplash.com/photo-1504711434969-e33886168f5c');
background-size:cover;
background-position:center;
display:flex;
justify-content:center;
align-items:center;
color:white;
text-align:center;
}

.hero h1{
font-size:42px;
background:rgba(0,0,0,0.6);
padding:15px 30px;
border-radius:10px;
}

/* NEWS CONTAINER */
.container{
padding:40px;
display:flex;
gap:25px;
flex-wrap:wrap;
justify-content:center;
}

/* CARD */
.card{
background:white;
width:280px;
border-radius:12px;
box-shadow:0 5px 15px rgba(0,0,0,0.2);
overflow:hidden;
transition:0.3s;
}

.card:hover{
transform:scale(1.05);
}

.card img{
width:100%;
height:180px;
object-fit:cover;
}

.card-content{
padding:15px;
}

footer{
background:#111827;
color:white;
padding:15px;
text-align:center;
margin-top:40px;
}

</style>
</head>

<body>

<nav>
<h2>📰 DailyNews</h2>

<div>
<a href="./index.html">Home</a>
<a href="./technology.html">Technology</a>
<a href="./politics.html">Politics</a>
<a href="./sports.html">Sports</a>
<a href="./business.html">Business</a>
<a href="./entertainment.html">Entertainment</a>
</div>
</nav>

<div class="hero">
<h1>Stay Updated with Latest News</h1>
</div>

<!-- NEWS LOAD HERE -->
<div class="container" id="news-container"></div>

<footer>
DailyNews © 2026 | Professional News Portal
</footer>

<!-- Supabase CDN -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

<script>
const supabaseUrl = "https://ufyjbyhjulxarfnvwuvb.supabase.co";
const supabaseKey = "sb_publishable_73mw2OvGn_DUxTeL4uE4Tw_HNVZwOTf";

const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);

async function loadNews() {
  const container = document.getElementById("news-container");

  try {
    const { data, error } = await supabase
      .from("news1")
      .select("*");

    console.log("DATA:", data); // Debug

    if (error) {
      container.innerHTML = "<h2>Error loading data</h2>";
      console.log(error);
      return;
    }

    if (!data || data.length === 0) {
      container.innerHTML = "<h2>No news found</h2>";
      return;
    }

    container.innerHTML = "";

    data.forEach(news => {
      container.innerHTML += `
        <div class="card">
          <img src="${news.image || 'https://via.placeholder.com/300'}">
          <div class="card-content">
            <h3>${news.title || 'No Title'}</h3>
            <p>${news.description || 'No Description'}</p>
            <p><b>${news.category || 'General'}</b></p>
          </div>
        </div>
      `;
    });

  } catch (err) {
    console.log("Unexpected Error:", err);
    container.innerHTML = "<h2>Something went wrong</h2>";
  }
}

loadNews();
</script>
</body>
</html>
