<!DOCTYPE html>
<html>
<head>
<title>News Portal</title>

<style>
body{
  font-family: Arial;
  margin:0;
  background:#f5f5f5;
}

/* NAVBAR */
nav{
  background:#112227;
  padding:15px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  flex-wrap:wrap;
}

nav h2{
  color:white;
  margin:0;
}

/* MENU */
.menu{
  margin-top:10px;
}

.menu a{
  color:white;
  margin:10px;
  cursor:pointer;
  font-weight:bold;
}

.menu a:hover{
  color:#3b82f6;
}

/* SEARCH */
.search-box{
  padding:8px;
  border-radius:5px;
  border:none;
  width:200px;
}

/* NEWS */
.container{
  display:flex;
  flex-wrap:wrap;
  gap:20px;
  padding:30px;
  justify-content:center;
}

/* CARD */
.card{
  background:white;
  width:260px;
  border-radius:10px;
  box-shadow:0 4px 10px rgba(0,0,0,0.2);
  overflow:hidden;
}

.card img{
  width:100%;
  height:160px;
  object-fit:cover;
}

.card-content{
  padding:15px;
}

footer{
  background:#111827;
  color:white;
  text-align:center;
  padding:10px;
}
</style>
</head>

<body>

<!-- NAVBAR -->
<nav>
  <h2>📰 DailyNews</h2>

  <input 
    class="search-box"
    type="text" 
    placeholder="Search..." 
    onkeyup="searchNews(this.value)"
  >

  <div class="menu">
    <a onclick="filterNews('all')">Home</a>
    <a onclick="filterNews('Technology')">Technology</a>
    <a onclick="filterNews('Politics')">Politics</a>
    <a onclick="filterNews('Sports')">Sports</a>
    <a onclick="filterNews('Business')">Business</a>
    <a onclick="filterNews('Entertainment')">Entertainment</a>
  </div>
</nav>

<!-- NEWS -->
<div class="container" id="news-container">
  <h2>Loading...</h2>
</div>

<footer>
DailyNews © 2026
</footer>

<!-- SUPABASE -->
<script src="https://unpkg.com/@supabase/supabase-js@1"></script>

<script>
const supabaseClient = supabase.createClient(
  "https://ufyjbyhjulxarfnvwuvb.supabase.co",
  "sb_publishable_73mw2OvGn_DUxTeL4uE4Tw_HNVZwOTf"
);

let allNews = [];
let currentCategory = "all";

// LOAD DATA
async function loadNews() {
  const { data, error } = await supabaseClient
    .from("news1")
    .select("*");

  if (error) {
    document.getElementById("news-container").innerHTML = "Error loading data";
    return;
  }

  allNews = data;
  displayNews(allNews);
}

// DISPLAY FUNCTION
function displayNews(newsArray) {
  const container = document.getElementById("news-container");
  container.innerHTML = "";

  newsArray.forEach(news => {

    let imageUrl = "https://via.placeholder.com/300";

    if (news.image && news.image.startsWith("http")) {
      imageUrl = news.image;
    }

    container.innerHTML += `
      <div class="card">
        <img src="${imageUrl}">
        <div class="card-content">
          <h3>${news.title}</h3>
          <p>${news.description}</p>
          <p><b>${news.category}</b></p>
        </div>
      </div>
    `;
  });
}

// CATEGORY FILTER
function filterNews(category) {
  currentCategory = category;

  if (category === "all") {
    displayNews(allNews);
  } else {
    const filtered = allNews.filter(n => n.category === category);
    displayNews(filtered);
  }
}

// SEARCH FUNCTION
function searchNews(text) {
  let filtered = allNews;

  if (currentCategory !== "all") {
    filtered = filtered.filter(n => n.category === currentCategory);
  }

  filtered = filtered.filter(n =>
    (n.title || "").toLowerCase().includes(text.toLowerCase()) ||
    (n.description || "").toLowerCase().includes(text.toLowerCase())
  );

  displayNews(filtered);
}

// START
loadNews();
</script>

</body>
</html>
