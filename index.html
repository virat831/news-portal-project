<!DOCTYPE html>
<html>
<head>
<title>Advanced News Portal</title>

<style>
body{font-family:Arial;background:#f5f7fa;margin:0;}

nav{
background:#112227;
padding:15px;
display:flex;
justify-content:space-between;
align-items:center;
color:white;
}

nav input{
padding:6px;
border-radius:5px;
border:none;
}

.container{
padding:20px;
display:flex;
flex-wrap:wrap;
gap:20px;
justify-content:center;
}

.card{
background:white;
width:250px;
border-radius:10px;
box-shadow:0 4px 10px rgba(0,0,0,0.2);
overflow:hidden;
}

.card img{width:100%;height:150px;object-fit:cover;}

.card-content{padding:10px;}

button{
margin:3px;
padding:5px 10px;
border:none;
border-radius:5px;
cursor:pointer;
}

.add-btn{background:green;color:white;}
.delete-btn{background:red;color:white;}
</style>
</head>

<body>

<nav>
<h2>📰 News Portal</h2>
<input type="text" placeholder="Search..." onkeyup="searchNews(this.value)">
<button class="add-btn" onclick="addNews()">+ Add</button>
</nav>

<div class="container" id="news-container"></div>

<script src="https://unpkg.com/@supabase/supabase-js@1"></script>

<script>
const supabaseClient = supabase.createClient(
  "https://ufyjbyhjulxarfnvwuvb.supabase.co",
  "sb_publishable_73mw2OvGn_DUxTeL4uE4Tw_HNVZwOTf"
);

let allNews = [];

// LOAD NEWS
async function loadNews(){
  const {data} = await supabaseClient.from("news1").select("*");
  allNews = data;
  displayNews(allNews);
}

// DISPLAY
function displayNews(data){
  let container = document.getElementById("news-container");
  container.innerHTML="";

  data.forEach(n=>{
    container.innerHTML+=`
    <div class="card">
      <img src="${n.image || 'https://via.placeholder.com/300'}">
      <div class="card-content">
        <h3>${n.title}</h3>
        <p>${n.description}</p>
        <p>${n.category}</p>
        <button class="delete-btn" onclick="deleteNews(${n.id})">Delete</button>
      </div>
    </div>`;
  });
}

// SEARCH
function searchNews(text){
  let filtered = allNews.filter(n =>
    n.title.toLowerCase().includes(text.toLowerCase())
  );
  displayNews(filtered);
}

// ADD NEWS
async function addNews(){
  let title = prompt("Enter Title");
  let desc = prompt("Enter Description");
  let cat = prompt("Enter Category");
  let img = prompt("Enter Image URL");

  await supabaseClient.from("news1").insert([
    {title:title, description:desc, category:cat, image:img}
  ]);

  loadNews();
}

// DELETE
async function deleteNews(id){
  await supabaseClient.from("news1").delete().eq("id", id);
  loadNews();
}

// START
loadNews();
</script>

</body>
</html>
