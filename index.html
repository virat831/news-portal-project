<!DOCTYPE html>
<html>
<head>
  <title>News Portal</title>

  <style>
    body {
      font-family: Arial;
      background: #f5f5f5;
      padding: 20px;
    }

    h1 {
      text-align: center;
    }

    .news-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
    }

    .card {
      background: white;
      padding: 10px;
      border-radius: 10px;
    }

    img {
      width: 100%;
    }
  </style>
</head>

<body>

<h1>📰 My News Portal</h1>

<div id="news-container" class="news-container"></div>

<!-- Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

<script>
const supabaseUrl = "https://ufyjbyhjulxarfnvwuvb.supabase.co";
const supabaseKey = "sb_publishable_73mw2OvGn_DUxTeL4uE4Tw_HNVZwOTf";

const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);

async function fetchNews() {
  const { data, error } = await supabase
    .from("news1")
    .select("*");

  if (error) {
    console.log(error);
    return;
  }

  const container = document.getElementById("news-container");
  container.innerHTML = "";

  data.forEach(item => {
    container.innerHTML += `
      <div class="card">
        <img src="${item.image}">
        <h3>${item.title}</h3>
        <p>${item.description}</p>
        <small>${item.category}</small>
      </div>
    `;
  });
}

fetchNews();
</script>

</body>
</html>
